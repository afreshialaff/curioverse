<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Dua skema berdampingan: tali jemuran yang melorot menarik dua tiang mendekat, dan lantai baja yang melorot menarik dua kolom ke arah dalam">
<rect width="1600" height="900" fill="#EFE4C6"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CFC3A0" stroke-width="3"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B80B17"/></marker>
</defs>
<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#0B1450">Lantai melorot, kolom tertarik ke dalam</text>
<text x="100" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180">Skema sederhana, bukan gambar teknis gedung</text>

<text x="418" y="245" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1450" text-anchor="middle">Tali jemuran</text>
<line x1="120" y1="680" x2="720" y2="680" stroke="#CFC3A0" stroke-width="4"/>
<rect x="170" y="300" width="26" height="380" fill="#0B1450"/>
<rect x="640" y="300" width="26" height="380" fill="#0B1450"/>
<line x1="196" y1="330" x2="640" y2="330" stroke="#1F56A8" stroke-width="5" stroke-dasharray="16 12"/>
<text x="418" y="318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1F56A8" text-anchor="middle">mula-mula lurus</text>
<path d="M196 330 Q418 790 640 330" fill="none" stroke="#B80B17" stroke-width="8" stroke-linecap="round"/>
<rect x="282" y="500" width="50" height="95" rx="6" fill="#F6EED6" stroke="#0B1450" stroke-width="3"/>
<rect x="393" y="558" width="50" height="95" rx="6" fill="#F6EED6" stroke="#0B1450" stroke-width="3"/>
<rect x="504" y="500" width="50" height="95" rx="6" fill="#F6EED6" stroke="#0B1450" stroke-width="3"/>
<line x1="125" y1="285" x2="215" y2="285" stroke="#B80B17" stroke-width="7" marker-end="url(#ar)"/>
<line x1="715" y1="285" x2="625" y2="285" stroke="#B80B17" stroke-width="7" marker-end="url(#ar)"/>
<text x="418" y="735" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180" text-anchor="middle">tiang tertarik mendekat</text>

<text x="1170" y="245" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#0B1450" text-anchor="middle">Lantai menara</text>
<line x1="870" y1="680" x2="1470" y2="680" stroke="#CFC3A0" stroke-width="4"/>
<rect x="920" y="300" width="40" height="380" fill="#0B1450"/>
<rect x="1380" y="300" width="40" height="380" fill="#0B1450"/>
<line x1="960" y1="330" x2="1380" y2="330" stroke="#1F56A8" stroke-width="5" stroke-dasharray="16 12"/>
<text x="1170" y="318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1F56A8" text-anchor="middle">mula-mula lurus</text>
<path d="M960 330 Q1170 790 1380 330" fill="none" stroke="#B80B17" stroke-width="12" stroke-linecap="round"/>
<text x="1170" y="640" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#B80B17" text-anchor="middle">baja memanas dan melemah</text>
<line x1="875" y1="285" x2="955" y2="285" stroke="#B80B17" stroke-width="7" marker-end="url(#ar)"/>
<line x1="1465" y1="285" x2="1385" y2="285" stroke="#B80B17" stroke-width="7" marker-end="url(#ar)"/>
<text x="1170" y="735" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180" text-anchor="middle">kolom tertarik ke arah dalam</text>

<text x="100" y="806" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#0B1450">Tali = lantai · Tiang = kolom · Handuk = beban di atas lantai</text>
<text x="1540" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4B5180" text-anchor="end">Ilustrasi: Curioverse</text>
</svg>
