<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Linimasa perang arus AC dan DC dari 1882 sampai 2007">
<style>
.t{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif}
.s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
.pulse{animation:jalan 9s linear infinite}
@keyframes jalan{0%{transform:translateX(0)}100%{transform:translateX(1340px)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}
</style>
<rect width="1600" height="900" fill="#EFE4C6"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#0B1450" stroke-opacity=".25" stroke-width="3"/>
<text x="100" y="130" class="s" font-size="72" fill="#0B1450">Perang arus, 1882 sampai 2007</text>
<text x="100" y="185" class="t" font-size="32" fill="#0B1450" fill-opacity=".75">DC Edison (biru tua) melawan AC Tesla dan Westinghouse (merah)</text>
<line x1="130" x2="1470" y1="480" y2="480" stroke="#0B1450" stroke-width="6"/>
<g class="pulse"><circle cx="130" cy="480" r="12" fill="#B80B17"/></g>
<g class="t" font-size="27" fill="#0B1450">
  <g transform="translate(130 480)"><circle r="16" fill="#0B1450"/><line y1="-16" y2="-80" stroke="#0B1450" stroke-width="3"/><text y="-150" font-size="40" font-weight="700">1882</text><text y="-112">Pearl Street, DC</text></g>
  <g transform="translate(330 480)"><circle r="16" fill="#B80B17"/><line y1="16" y2="80" stroke="#B80B17" stroke-width="3"/><text y="128" font-size="40" font-weight="700" fill="#B80B17">1884</text><text y="166">Tesla tiba</text><text y="200">di New York</text></g>
  <g transform="translate(530 480)"><circle r="16" fill="#B80B17"/><line y1="-16" y2="-80" stroke="#B80B17" stroke-width="3"/><text y="-150" font-size="40" font-weight="700" fill="#B80B17">1888</text><text y="-112">paten motor AC</text></g>
  <g transform="translate(730 480)"><circle r="16" fill="#0B1450"/><line y1="16" y2="80" stroke="#0B1450" stroke-width="3"/><text y="128" font-size="40" font-weight="700">1890</text><text y="166">kursi listrik</text><text y="200">pertama, AC</text></g>
  <g transform="translate(930 480)"><circle r="16" fill="#0B1450"/><line y1="-16" y2="-80" stroke="#0B1450" stroke-width="3"/><text y="-150" font-size="40" font-weight="700">1892</text><text y="-112">lahir GE</text></g>
  <g transform="translate(1100 480)"><circle r="16" fill="#B80B17"/><line y1="16" y2="80" stroke="#B80B17" stroke-width="3"/><text y="128" font-size="40" font-weight="700" fill="#B80B17">1893</text><text y="166">Chicago</text><text y="200">diterangi AC</text></g>
  <g transform="translate(1270 480)"><circle r="16" fill="#B80B17"/><line y1="-16" y2="-80" stroke="#B80B17" stroke-width="3"/><text y="-150" font-size="40" font-weight="700" fill="#B80B17">1896</text><text y="-112">Niagara ke Buffalo</text></g>
  <g transform="translate(1470 480)"><circle r="16" fill="#0B1450"/><line y1="16" y2="80" stroke="#0B1450" stroke-width="3"/><text y="128" font-size="40" font-weight="700" text-anchor="end">2007</text><text y="166" text-anchor="end">DC terakhir</text><text y="200" text-anchor="end">di New York mati</text></g>
</g>
<text x="100" y="820" class="t" font-size="24" fill="#0B1450" fill-opacity=".6">Curioverse</text>
</svg>
