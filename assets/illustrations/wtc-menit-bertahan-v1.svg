<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagram batang: WTC 1 bertahan sekitar 103 menit setelah ditabrak, WTC 2 sekitar 56 menit">
<rect width="1600" height="900" fill="#EFE4C6"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CFC3A0" stroke-width="3"/>
<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#0B1450">Berapa lama menara bertahan</text>
<text x="100" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180">Menit sejak tabrakan sampai runtuh, menurut NIST</text>
<g stroke="#CFC3A0" stroke-width="2">
<line x1="300" y1="250" x2="300" y2="700"/>
<line x1="510" y1="250" x2="510" y2="700"/>
<line x1="720" y1="250" x2="720" y2="700"/>
<line x1="930" y1="250" x2="930" y2="700"/>
<line x1="1140" y1="250" x2="1140" y2="700"/>
</g>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#4B5180" text-anchor="middle">
<text x="300" y="745">0</text>
<text x="510" y="745">30</text>
<text x="720" y="745">60</text>
<text x="930" y="745">90</text>
<text x="1140" y="745">120 menit</text>
</g>
<text x="100" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1450">WTC 1</text>
<rect x="300" y="310" width="721" height="110" rx="10" fill="#0B1450"/>
<text x="1045" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#0B1450">±103</text>
<text x="300" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180">Lapisan tahan api di sebagian besar lantai terdampak: 1½ inci</text>
<text x="100" y="595" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1450">WTC 2</text>
<rect x="300" y="530" width="392" height="110" rx="10" fill="#B80B17"/>
<text x="716" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#B80B17">56</text>
<text x="300" y="690" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4B5180">Lapisan tahan api di sebagian besar lantai terdampak: ½ inci</text>
<g transform="translate(1180 270)">
<rect width="340" height="250" rx="18" fill="#F6EED6" stroke="#CFC3A0" stroke-width="3"/>
<text x="26" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1450">Bahan bakar pesawat</text>
<text x="26" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#0B1450">sebagian besar habis</text>
<text x="26" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#0B1450">terbakar dalam beberapa</text>
<text x="26" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#0B1450">menit pertama</text>
</g>
<text x="100" y="810" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4B5180">Dua angka ditaruh berdampingan sebagai pembanding, bukan klaim sebab-akibat.</text>
<text x="1540" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4B5180" text-anchor="end">Ilustrasi: Curioverse · data: NIST</text>
</svg>
