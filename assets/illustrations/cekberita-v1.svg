    <circle cx="300" cy="460" r="52" fill="#A67C52" stroke="#EAE3D5" stroke-width="6"/><text x="300" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700" text-anchor="middle">?</text>
  </g><rect x="640" y="206" width="72" height="72" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="5"/><path d="M656 242 L672 260 L700 220" fill="none" stroke="#3F4A3B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1A17" font-weight="700">1. Siapa sumbernya?</text><rect x="640" y="316" width="72" height="72" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="5"/><path d="M656 352 L672 370 L700 330" fill="none" stroke="#3F4A3B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1A17" font-weight="700">2. Kapan kejadiannya?</text><rect x="640" y="426" width="72" height="72" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="5"/><path d="M656 462 L672 480 L700 440" fill="none" stroke="#3F4A3B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1A17" font-weight="700">3. Ada data atau cuma klaim?</text><rect x="640" y="536" width="72" height="72" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="5"/><path d="M656 572 L672 590 L700 550" fill="none" stroke="#3F4A3B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1A17" font-weight="700">4. Media lain bilang apa?</text><rect x="640" y="646" width="72" height="72" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="5"/><path d="M656 682 L672 700 L700 660" fill="none" stroke="#3F4A3B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1A17" font-weight="700">5. Judulnya bikin emosi?</text>
