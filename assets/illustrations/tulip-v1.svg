<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ilustrasi tulip bergaris merah-putih dan grafik pola gelembung harga yang naik lalu jatuh pada Februari 1637">
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>

<defs><pattern id="st" width="44" height="400" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><rect width="44" height="400" fill="#F4EEE3"/><path d="M8 0 Q 26 100 12 200 Q 0 300 18 400" stroke="#9A3F2B" stroke-width="12" fill="none"/></pattern></defs>
<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700">Tulip mania, 1636 sampai 1637</text>
<g transform="translate(400 210) scale(.85)">
    <path d="M0 330 Q -10 520 10 700" stroke="#3F4A3B" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M6 600 Q -140 520 -160 380 Q -60 450 6 560 Z" fill="#3F4A3B"/>
    <path d="M8 650 Q 150 600 170 450 Q 70 530 8 610 Z" fill="#3F4A3B" opacity=".85"/>
    <path d="M-120 120 Q -150 280 0 340 Q -40 220 -20 60 Q -80 60 -120 120 Z" fill="url(#st)" stroke="#1B1A17" stroke-width="5" stroke-linejoin="round"/>
    <path d="M120 120 Q 150 280 0 340 Q 40 220 20 60 Q 80 60 120 120 Z" fill="url(#st)" stroke="#1B1A17" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-60 40 Q 0 -20 60 40 Q 90 220 0 340 Q -90 220 -60 40 Z" fill="url(#st)" stroke="#1B1A17" stroke-width="5" stroke-linejoin="round"/>
  </g>
<line x1="800" y1="700" x2="1460" y2="700" stroke="#1B1A17" stroke-width="3"/>
<line x1="800" y1="700" x2="800" y2="220" stroke="#1B1A17" stroke-width="3"/>
<text x="786" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4D483F" text-anchor="end">harga</text>
<path d="M800,660 C 900,650 980,630 1060,560 C 1130,490 1180,320 1240,240 C 1262,230 1272,240 1282,300 C 1300,520 1340,640 1460,680" fill="none" stroke="#A67C52" stroke-width="10" stroke-linecap="round"/>
<text x="1060" y="760" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4D483F" text-anchor="middle">musim dingin 1636</text><text x="1300" y="760" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9A3F2B" font-weight="700" text-anchor="middle">Feb 1637</text>
<text x="1250" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#9A3F2B" font-weight="700" text-anchor="middle" font-style="italic">pop!</text>
<text x="820" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4D483F">bentuk gelembung harga,</text><text x="820" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4D483F">bukan data harga asli</text>
<text x="1540" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4D483F" text-anchor="end">Ilustrasi: Curioverse</text>
</svg>
