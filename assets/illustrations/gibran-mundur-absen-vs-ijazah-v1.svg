<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Perumpamaan: certificate of attendance seperti kartu absen les yang penuh stempel, membuktikan hadir; ijazah seperti rapor kelulusan, membuktikan lulus. Surat penyetaraan seharusnya menyetarakan bukti lulus dari luar negeri dengan SMA. MA pada 30 Oktober 2026 menyatakan surat penyetaraan Gibran tidak sah karena dasarnya hanya menunjukkan kehadiran di kelas.">
<style>.f{font-family:'Helvetica Neue',Arial,sans-serif}.s{font-family:Georgia,'Times New Roman',serif}
.st{animation:stamp 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%,30%{opacity:.25;transform:scale(1.3)}40%,90%{opacity:1;transform:scale(1)}100%{opacity:.25;transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){.st{animation:none;opacity:1}}</style>
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>
<text x="100" y="112" class="s" font-size="54" font-weight="700" fill="#1B1A17">Bukti hadir tidak sama dengan bukti lulus</text>
<text x="100" y="160" class="f" font-size="27" fill="#4D483F">Gambaran gampang soal dokumen yang dinilai MK dan MA</text>
<g class="f">
  <rect x="100" y="220" width="620" height="420" rx="18" fill="#F6F1E6" stroke="#1B1A17" stroke-width="3"/>
  <text x="410" y="275" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A17">Kartu absen les</text>
  <text x="410" y="312" font-size="24" text-anchor="middle" fill="#4D483F">= certificate of attendance</text>
  <g fill="none" stroke="#43578C" stroke-width="4">
    <circle cx="200" cy="390" r="30"/><circle cx="290" cy="390" r="30"/><circle cx="380" cy="390" r="30"/><circle cx="470" cy="390" r="30"/><circle cx="560" cy="390" r="30"/>
    <circle cx="200" cy="470" r="30"/><circle cx="290" cy="470" r="30"/><circle cx="380" cy="470" r="30"/><circle cx="470" cy="470" r="30"/>
  </g>
  <text x="410" y="575" font-size="27" text-anchor="middle" fill="#1B1A17">Membuktikan: rajin <tspan font-weight="700">hadir</tspan></text>
  <text x="410" y="612" font-size="24" text-anchor="middle" fill="#4D483F">ditambah transkrip dan catatan nilai</text>

  <rect x="880" y="220" width="620" height="420" rx="18" fill="#F6F1E6" stroke="#1B1A17" stroke-width="3"/>
  <text x="1190" y="275" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A17">Rapor kelulusan</text>
  <text x="1190" y="312" font-size="24" text-anchor="middle" fill="#4D483F">= ijazah atau diploma setara SMA</text>
  <rect x="1010" y="350" width="360" height="150" rx="10" fill="none" stroke="#2F6E3A" stroke-width="4"/>
  <text x="1190" y="440" font-size="40" font-weight="700" text-anchor="middle" fill="#2F6E3A">LULUS</text>
  <text x="1190" y="575" font-size="27" text-anchor="middle" fill="#1B1A17">Membuktikan: <tspan font-weight="700">lulus</tspan></text>
  <text x="1190" y="612" font-size="24" text-anchor="middle" fill="#4D483F">syarat ikut pencalonan</text>

  <text x="800" y="445" font-size="64" font-weight="700" text-anchor="middle" fill="#B5462F">≠</text>

  <rect x="100" y="680" width="1400" height="150" rx="18" fill="#1B1A17"/>
  <text x="140" y="740" font-size="27" fill="#EAE3D5">Surat penyetaraan seharusnya mengubah bukti <tspan font-weight="700">lulus</tspan> dari luar negeri</text>
  <text x="140" y="782" font-size="27" fill="#EAE3D5">jadi setara SMA. MA: dasarnya cuma menunjukkan kehadiran di kelas.</text>
  <g class="st"><rect x="1250" y="700" width="220" height="110" rx="10" fill="none" stroke="#E8735A" stroke-width="5" transform="rotate(-6 1360 755)"/>
  <text x="1360" y="770" font-size="34" font-weight="700" text-anchor="middle" fill="#E8735A" transform="rotate(-6 1360 755)">TIDAK SAH</text></g>
</g>
</svg>
