<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Perumpamaan DC sebagai air di selang yang mengalir ke satu arah, dan AC sebagai gergaji yang didorong maju-mundur">
<style>
.t{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif}
.s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
.air{animation:alir 3s linear infinite}
.gergaji{animation:maju 2s ease-in-out infinite alternate}
@keyframes alir{0%{transform:translateX(0)}100%{transform:translateX(120px)}}
@keyframes maju{0%{transform:translateX(-70px)}100%{transform:translateX(70px)}}
@media (prefers-reduced-motion: reduce){.air,.gergaji{animation:none}}
</style>
<rect width="1600" height="900" fill="#EFE4C6"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#0B1450" stroke-opacity=".25" stroke-width="3"/>
<text x="100" y="125" class="s" font-size="66" fill="#0B1450">Beda DC dan AC, versi gampangnya</text>
<!-- DC panel -->
<g transform="translate(90 190)">
  <rect width="680" height="560" rx="20" fill="#F7F0DC" stroke="#0B1450" stroke-opacity=".3" stroke-width="3"/>
  <text x="40" y="75" class="t" font-size="44" font-weight="800" fill="#0B1450">DC · arus searah</text>
  <text x="40" y="125" class="t" font-size="30" fill="#0B1450" fill-opacity=".8">seperti air di selang</text>
  <rect x="40" y="250" width="600" height="70" rx="35" fill="#0B1450" fill-opacity=".15" stroke="#0B1450" stroke-width="4"/>
  <clipPath id="selang"><rect x="44" y="254" width="592" height="62" rx="31"/></clipPath>
  <g clip-path="url(#selang)"><g class="air" fill="#0B1450">
    <path d="M-80 267 l40 18 l-40 18z M40 267 l40 18 l-40 18z M160 267 l40 18 l-40 18z M280 267 l40 18 l-40 18z M400 267 l40 18 l-40 18z M520 267 l40 18 l-40 18z M640 267 l40 18 l-40 18z"/>
  </g></g>
  <text x="40" y="410" class="t" font-size="30" fill="#0B1450">terus mengalir ke satu arah</text>
  <text x="40" y="455" class="t" font-size="30" fill="#0B1450">contoh: listrik dari baterai</text>
</g>
<!-- AC panel -->
<g transform="translate(830 190)">
  <rect width="680" height="560" rx="20" fill="#F7F0DC" stroke="#B80B17" stroke-opacity=".45" stroke-width="3"/>
  <text x="40" y="75" class="t" font-size="44" font-weight="800" fill="#B80B17">AC · arus bolak-balik</text>
  <text x="40" y="125" class="t" font-size="30" fill="#0B1450" fill-opacity=".8">seperti gergaji maju-mundur</text>
  <rect x="200" y="300" width="280" height="80" fill="#C89B62" stroke="#0B1450" stroke-width="3"/>
  <g class="gergaji">
    <path d="M140 270 h400 v26 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-12 14 l-12 -14 l-16 0 z" fill="#B80B17"/>
    <rect x="70" y="250" width="80" height="60" rx="14" fill="#0B1450"/>
  </g>
  <text x="340" y="232" class="t" font-size="42" font-weight="800" fill="#B80B17" text-anchor="middle">⟵   ⟶</text>
  <text x="40" y="440" class="t" font-size="30" fill="#0B1450">arahnya berganti terus</text>
  <text x="40" y="485" class="t" font-size="30" fill="#0B1450">tapi kayunya tetap terpotong</text>
</g>
<text x="800" y="815" class="t" font-size="30" fill="#0B1450" text-anchor="middle">Di Amerika Serikat, arah arus AC berbalik 60 kali per detik</text>
</svg>
