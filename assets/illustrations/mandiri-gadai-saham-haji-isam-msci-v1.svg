<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Dua kolom gadai saham dan repo, dengan garis waktu Januari sampai 15 Oktober 2026">
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>

<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700">Gadai atau repo?</text>
<text x="100" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#4D483F">Pertanyaan kuncinya: siapa yang memegang saham</text>
<g transform="translate(150 205)">
  <rect width="620" height="290" rx="18" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/>
  <rect width="620" height="70" rx="18" fill="#3F4A3B"/><rect y="50" width="620" height="20" fill="#3F4A3B"/>
  <text x="310" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#F1ECE1" font-weight="700" text-anchor="middle">GADAI</text>
  <circle cx="44" cy="128" r="8" fill="#3F4A3B"/><text x="70" y="138" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Saham tetap milik pemberi gadai</text><circle cx="44" cy="190" r="8" fill="#3F4A3B"/><text x="70" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Jadi agunan tambahan kredit</text><circle cx="44" cy="252" r="8" fill="#3F4A3B"/><text x="70" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Dieksekusi hanya jika gagal bayar</text>
</g>
<g transform="translate(830 205)">
  <rect width="620" height="290" rx="18" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/>
  <rect width="620" height="70" rx="18" fill="#7A5532"/><rect y="50" width="620" height="20" fill="#7A5532"/>
  <text x="310" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#F1ECE1" font-weight="700" text-anchor="middle">REPO</text>
  <circle cx="44" cy="128" r="8" fill="#7A5532"/><text x="70" y="138" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Kepemilikan saham pindah dulu</text><circle cx="44" cy="190" r="8" fill="#7A5532"/><text x="70" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Diwajibkan POJK 9/2015</text><circle cx="44" cy="252" r="8" fill="#7A5532"/><text x="70" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17">Ada janji beli kembali</text>
</g>
<line x1="200" x2="1400" y1="640" y2="640" stroke="#CDBFA6" stroke-width="6"/>
<circle cx="200" cy="640" r="16" fill="#3F4A3B"/><text x="200" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#3F4A3B" font-weight="700" text-anchor="middle">Jan 2026</text><text x="200" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1B1A17" text-anchor="middle">MSCI singgung</text><text x="200" y="726" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F" text-anchor="middle">risiko turun kelas</text><circle cx="500" cy="640" r="16" fill="#3F4A3B"/><text x="500" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#3F4A3B" font-weight="700" text-anchor="middle">24 Jun</text><text x="500" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1B1A17" text-anchor="middle">MSCI: tetap Emerging,</text><text x="500" y="726" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F" text-anchor="middle">beri tenggat</text><circle cx="800" cy="640" r="16" fill="#9A3F2B"/><text x="800" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9A3F2B" font-weight="700" text-anchor="middle">30 Sep</text><text x="800" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1B1A17" text-anchor="middle">Akta gadai</text><text x="800" y="726" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F" text-anchor="middle">saham JARR</text><circle cx="1100" cy="640" r="16" fill="#9A3F2B"/><text x="1100" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#9A3F2B" font-weight="700" text-anchor="middle">7 Okt</text><text x="1100" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1B1A17" text-anchor="middle">Gadai diumumkan</text><text x="1100" y="726" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F" text-anchor="middle">di BEI</text><circle cx="1400" cy="640" r="16" fill="#3F4A3B"/><text x="1400" y="606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#3F4A3B" font-weight="700" text-anchor="middle">15 Okt</text><text x="1400" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1B1A17" text-anchor="middle">MSCI usul pindah</text><text x="1400" y="726" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F" text-anchor="middle">ke Standalone</text>
<text x="1540" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4D483F" text-anchor="end">Ilustrasi: Curioverse · skema disederhanakan, tanpa skala waktu</text>
</svg>
