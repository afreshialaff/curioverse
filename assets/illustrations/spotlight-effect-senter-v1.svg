<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Perumpamaan spotlight effect. Kiri, versi di kepalamu: satu lampu panggung besar menyorot kamu. Kanan, versi nyata: setiap orang di ruangan memegang senter kecil yang diarahkan ke dirinya sendiri.">
<style>
.f{font-family:'Helvetica Neue',Arial,sans-serif}
.s{font-family:Georgia,'Times New Roman',serif}
@keyframes sorot{0%,30%{transform:scale(1)}55%,85%{transform:scale(0.45)}100%{transform:scale(1)}}
@keyframes kedip{0%,30%{opacity:.35}55%,85%{opacity:1}100%{opacity:.35}}
.sorot{transform-box:fill-box;transform-origin:50% 0%;animation:sorot 10s ease-in-out infinite}
.kecil{animation:kedip 10s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sorot{animation:none;transform:none}.kecil{animation:none;opacity:1}}
</style>
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>
<text x="100" y="110" class="s" font-size="56" font-weight="700" fill="#1B1A17">Lampu panggung vs senter masing-masing</text>
<line x1="800" y1="150" x2="800" y2="820" stroke="#CDBFA6" stroke-width="3"/>

<text x="440" y="190" class="f" font-size="32" font-weight="700" fill="#7A5532" text-anchor="middle">VERSI DI KEPALAMU</text>
<polygon class="sorot" points="440,230 250,700 630,700" fill="#E8C77A" opacity="0.7"/>
<circle cx="440" cy="230" r="22" fill="#1B1A17"/>
<g fill="#1B1A17"><circle cx="440" cy="600" r="30"/><rect x="405" y="635" width="70" height="90" rx="20"/></g>
<text x="440" y="760" class="f" font-size="26" fill="#1B1A17" text-anchor="middle">kamu = pusat perhatian</text>
<text x="440" y="815" class="f" font-size="24" fill="#4D483F" text-anchor="middle">semua mata (kamu kira) tertuju ke kamu</text>

<text x="1180" y="190" class="f" font-size="32" font-weight="700" fill="#3F4A3B" text-anchor="middle">VERSI NYATA</text>
<g class="kecil" fill="#E8C77A">
  <polygon points="930,330 890,440 970,440"/><polygon points="1180,330 1140,440 1220,440"/><polygon points="1430,330 1390,440 1470,440"/>
  <polygon points="1055,560 1015,670 1095,670"/><polygon points="1305,560 1265,670 1345,670"/>
</g>
<g fill="#1B1A17">
  <circle cx="930" cy="410" r="20"/><rect x="908" y="432" width="44" height="56" rx="14"/><rect x="920" y="318" width="20" height="14" rx="3"/>
  <circle cx="1180" cy="410" r="20"/><rect x="1158" y="432" width="44" height="56" rx="14"/><rect x="1170" y="318" width="20" height="14" rx="3"/>
  <circle cx="1430" cy="410" r="20"/><rect x="1408" y="432" width="44" height="56" rx="14"/><rect x="1420" y="318" width="20" height="14" rx="3"/>
  <circle cx="1055" cy="640" r="20"/><rect x="1033" y="662" width="44" height="56" rx="14"/><rect x="1045" y="548" width="20" height="14" rx="3"/>
  <circle cx="1305" cy="640" r="20"/><rect x="1283" y="662" width="44" height="56" rx="14"/><rect x="1295" y="548" width="20" height="14" rx="3"/>
</g>
<text x="1180" y="760" class="f" font-size="26" fill="#1B1A17" text-anchor="middle">tiap orang menyorot dirinya sendiri</text>
<text x="1180" y="815" class="f" font-size="24" fill="#4D483F" text-anchor="middle">perhatian ke kamu jauh lebih kecil dari tebakanmu</text>
</svg>
