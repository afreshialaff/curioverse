  <text x="30" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B1A17" font-style="italic">Kadang kamu ekstrover</text><text x="30" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B1A17" font-style="italic">dan supel, kadang introver</text><text x="30" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B1A17" font-style="italic">dan pendiam.</text>
  <text x="30" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B1A17" font-style="italic">Kamu punya kapasitas besar</text><text x="30" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#1B1A17" font-style="italic">yang belum kamu manfaatkan.</text>
  <rect x="30" y="420" width="340" height="50" rx="10" fill="#E1D8C6"/><text x="200" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#3F4A3B" font-weight="700" text-anchor="middle">“Kok gue banget!”</text>
