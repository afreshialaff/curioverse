<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Tiga kartu hasil tes kepribadian yang isinya sama persis untuk tiga mahasiswa berbeda">
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>

<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700">Satu profil untuk semua</text>
<text x="100" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#4D483F">Forer, 1948: 39 mahasiswa menerima “hasil tes” yang isinya sama persis</text>
<g transform="translate(150 250)">
  <circle cx="200" cy="0" r="46" fill="#3F4A3B"/><circle cx="200" cy="-12" r="18" fill="#EAE3D5"/><path d="M168 30 Q200 0 232 30" fill="#EAE3D5"/>
  <text x="200" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#1B1A17" font-weight="700" text-anchor="middle">Mahasiswa A</text>
