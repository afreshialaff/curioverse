<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Kiri: bayangan pulau sampah, dicoret. Kanan: semangkuk sup dengan taburan merica. Kuah sama dengan Samudra Pasifik Utara, merica sama dengan mikroplastik, adukan sendok sama dengan gyre.">
<style>
.f{font-family:'Helvetica Neue',Arial,sans-serif}
.s{font-family:Georgia,'Times New Roman',serif}
@keyframes geser{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,4px)}}
@keyframes ayun{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.merica{animation:geser 8s ease-in-out infinite}
.sendok{transform-box:view-box;transform-origin:1180px 520px;animation:ayun 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.merica,.sendok{animation:none}}
</style>
