<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Georgia, serif">
  <rect width="1200" height="760" fill="#EFE4C6"/>
  <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#0B1450">EROPA TERBELAH DUA, 1949–1991</text>
  <rect x="40" y="90" width="520" height="560" rx="18" fill="#0B1450"/>
  <text x="300" y="150" text-anchor="middle" font-size="32" font-weight="bold" fill="#EFE4C6">BLOK BARAT</text>
  <text x="300" y="192" text-anchor="middle" font-size="24" fill="#EFE4C6">Dipimpin Amerika Serikat</text>
  <text x="300" y="248" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFD98A">NATO (1949)</text>
  <text x="300" y="292" text-anchor="middle" font-size="21" fill="#EFE4C6">Aliansi militer: diserang satu,</text>
  <text x="300" y="322" text-anchor="middle" font-size="21" fill="#EFE4C6">dianggap menyerang semua</text>
  <text x="300" y="378" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFD98A">Marshall Plan (1948)</text>
  <text x="300" y="422" text-anchor="middle" font-size="21" fill="#EFE4C6">Bantuan ekonomi AS untuk</text>
  <text x="300" y="452" text-anchor="middle" font-size="21" fill="#EFE4C6">membangun lagi Eropa Barat</text>
  <text x="300" y="512" text-anchor="middle" font-size="21" fill="#EFE4C6">Sistem: demokrasi + kapitalisme</text>
  <text x="300" y="556" text-anchor="middle" font-size="21" fill="#EFE4C6">Anggota awal NATO: 12 negara,</text>
  <text x="300" y="586" text-anchor="middle" font-size="21" fill="#EFE4C6">termasuk AS, Inggris, Prancis</text>
  <rect x="640" y="90" width="520" height="560" rx="18" fill="#B80B17"/>
  <text x="900" y="150" text-anchor="middle" font-size="32" font-weight="bold" fill="#EFE4C6">BLOK TIMUR</text>
  <text x="900" y="192" text-anchor="middle" font-size="24" fill="#EFE4C6">Dipimpin Uni Soviet</text>
  <text x="900" y="248" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFD98A">Pakta Warsawa (1955)</text>
  <text x="900" y="292" text-anchor="middle" font-size="21" fill="#EFE4C6">Aliansi militer balasan,</text>
  <text x="900" y="322" text-anchor="middle" font-size="21" fill="#EFE4C6">markas komando di Moskow</text>
  <text x="900" y="378" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFD98A">Comecon (1949)</text>
  <text x="900" y="422" text-anchor="middle" font-size="21" fill="#EFE4C6">Kerja sama ekonomi negara-</text>
  <text x="900" y="452" text-anchor="middle" font-size="21" fill="#EFE4C6">negara komunis</text>
  <text x="900" y="512" text-anchor="middle" font-size="21" fill="#EFE4C6">Sistem: satu partai + ekonomi terpusat</text>
  <text x="900" y="556" text-anchor="middle" font-size="21" fill="#EFE4C6">Anggota: Uni Soviet, Polandia,</text>
  <text x="900" y="586" text-anchor="middle" font-size="21" fill="#EFE4C6">Jerman Timur, dan 5 negara lain</text>
  <rect x="572" y="90" width="56" height="560" fill="#0B1450" opacity="0.85"/>
  <text x="600" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#EFE4C6" transform="rotate(-90 600 370)">TIRAI BESI</text>
  <text x="600" y="706" text-anchor="middle" font-size="21" fill="#0B1450">Dua kubu, dua ideologi, satu benua — saling mengintai selama 44 tahun.</text>
</svg>
