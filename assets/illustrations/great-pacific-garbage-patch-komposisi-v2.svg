<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Dua batang. Berat total setidaknya 79.000 ton. Jumlah keping: mikroplastik 94 persen. Berat: mikroplastik sekitar 8 persen, benda lebih besar 92 persen. Hampir separuh total berat adalah jaring ikan sintetis.">
<style>
.f{font-family:'Helvetica Neue',Arial,sans-serif}
.s{font-family:Georgia,'Times New Roman',serif}
</style>
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>
<text x="90" y="105" class="s" font-size="52" fill="#1B1A17" font-weight="700">Dihitung vs ditimbang</text>
<text x="90" y="150" class="f" font-size="28" fill="#4D483F">Plastik di Great Pacific Garbage Patch, data Lebreton dkk. (2018)</text>
<text x="350" y="300" class="f" font-size="34" fill="#1B1A17" font-weight="700" text-anchor="end">Jumlah keping</text><text x="350" y="340" class="f" font-size="26" fill="#4D483F" text-anchor="end">± 1,8 triliun</text>
<g class="b"><rect x="380" y="250" width="996.4" height="110" fill="#5B7C9A"/><rect x="1376.4" y="250" width="63.6" height="110" fill="#A67C52"/></g>
<text x="410" y="322" class="f" font-size="40" fill="#FFFFFF" font-weight="700">mikroplastik 94%</text>
<text x="350" y="520" class="f" font-size="34" fill="#1B1A17" font-weight="700" text-anchor="end">Berat</text><text x="350" y="560" class="f" font-size="26" fill="#4D483F" text-anchor="end">≥ 79.000 ton</text>
<g class="b"><rect x="380" y="470" width="84.8" height="110" fill="#5B7C9A"/><rect x="464.8" y="470" width="975.2" height="110" fill="#A67C52"/></g>
<text x="494.8" y="542" class="f" font-size="40" fill="#FFFFFF" font-weight="700">benda lebih besar 92%</text>
<text x="380" y="620" class="f" font-size="28" fill="#5B7C9A" font-weight="700">↑ mikroplastik ± 8%</text>
<rect x="380" y="660" width="40" height="22" fill="#5B7C9A"/><text x="435" y="680" class="f" font-size="28" fill="#1B1A17">mikroplastik (lebih kecil dari 5 mm)</text>
<rect x="1000" y="660" width="40" height="22" fill="#A67C52"/><text x="1055" y="680" class="f" font-size="28" fill="#1B1A17">benda lebih besar</text>
<text x="380" y="760" class="f" font-size="30" fill="#7A5532" font-weight="700">Hampir separuh total berat: jaring ikan sintetis.</text><text x="1540" y="850" class="f" font-size="24" fill="#4D483F" text-anchor="end">Ilustrasi: Curioverse</text>
</svg>
