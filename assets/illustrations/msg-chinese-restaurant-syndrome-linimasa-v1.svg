<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Linimasa MSG: 1908 Ikeda mengisolasi glutamat dan mematenkan MSG; 1968 surat Chinese-Restaurant Syndrome di NEJM; 1969 studi Olney menyuntik anak tikus; 2023 tinjauan Sam Kean: mayoritas besar bukti menunjukkan MSG tidak berbahaya.">
<style>
.f{font-family:'Helvetica Neue',Arial,sans-serif}
.s{font-family:Georgia,'Times New Roman',serif}
@keyframes sorot{0%,20%{opacity:1}25%,100%{opacity:.55}}
.k{animation:sorot 12s linear infinite}
.k2{animation-delay:3s}.k3{animation-delay:6s}.k4{animation-delay:9s}
.k1,.k2,.k3,.k4{animation-fill-mode:backwards}
@media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
</style>
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>
<text x="90" y="110" class="s" font-size="52" fill="#1B1A17" font-weight="700">Bagaimana MSG dapat nama buruk</text>
<text x="90" y="160" class="f" font-size="28" fill="#4D483F">Empat tanggal, dari laboratorium di Jepang sampai tinjauan bukti modern</text>
<line x1="150" y1="420" x2="1450" y2="420" stroke="#1B1A17" stroke-width="6"/>
<g class="k k1"><circle cx="230" cy="420" r="30" fill="#3F4A3B"/><text x="230" y="340" class="s" font-size="56" fill="#3F4A3B" font-weight="700" text-anchor="middle">1908</text><rect x="55" y="480" width="350" height="216" rx="16" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/><text x="230" y="535" class="f" font-size="32" fill="#1B1A17" font-weight="700" text-anchor="middle">Kikunae Ikeda</text><text x="230" y="585" class="f" font-size="28" fill="#4D483F" text-anchor="middle">mengisolasi glutamat,</text><text x="230" y="627" class="f" font-size="28" fill="#4D483F" text-anchor="middle">menamai rasa umami,</text><text x="230" y="669" class="f" font-size="28" fill="#4D483F" text-anchor="middle">mematenkan MSG</text></g><g class="k k2"><circle cx="610" cy="420" r="30" fill="#9A3F2B"/><text x="610" y="340" class="s" font-size="56" fill="#9A3F2B" font-weight="700" text-anchor="middle">1968</text><rect x="435" y="480" width="350" height="174" rx="16" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/><text x="610" y="535" class="f" font-size="32" fill="#1B1A17" font-weight="700" text-anchor="middle">Surat di NEJM</text><text x="610" y="585" class="f" font-size="28" fill="#4D483F" text-anchor="middle">“Chinese-Restaurant</text><text x="610" y="627" class="f" font-size="28" fill="#4D483F" text-anchor="middle">Syndrome”, 4 April</text></g><g class="k k3"><circle cx="990" cy="420" r="30" fill="#9A3F2B"/><text x="990" y="340" class="s" font-size="56" fill="#9A3F2B" font-weight="700" text-anchor="middle">1969</text><rect x="815" y="480" width="350" height="174" rx="16" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/><text x="990" y="535" class="f" font-size="32" fill="#1B1A17" font-weight="700" text-anchor="middle">Studi Olney</text><text x="990" y="585" class="f" font-size="28" fill="#4D483F" text-anchor="middle">anak tikus disuntik</text><text x="990" y="627" class="f" font-size="28" fill="#4D483F" text-anchor="middle">MSG dosis besar</text></g><g class="k k4"><circle cx="1370" cy="420" r="30" fill="#3F6B3A"/><text x="1370" y="340" class="s" font-size="56" fill="#3F6B3A" font-weight="700" text-anchor="middle">2023</text><rect x="1195" y="480" width="350" height="174" rx="16" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/><text x="1370" y="535" class="f" font-size="32" fill="#1B1A17" font-weight="700" text-anchor="middle">Tinjauan Sam Kean</text><text x="1370" y="585" class="f" font-size="28" fill="#4D483F" text-anchor="middle">mayoritas besar bukti:</text><text x="1370" y="627" class="f" font-size="28" fill="#4D483F" text-anchor="middle">MSG tidak berbahaya</text></g><text x="1540" y="850" class="f" font-size="24" fill="#4D483F" text-anchor="end">Ilustrasi: Curioverse</text>
</svg>
