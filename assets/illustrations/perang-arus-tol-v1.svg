<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Perumpamaan trafo sebagai terminal yang memindahkan 1.000 penumpang dari banyak motor ke sedikit bus sebelum masuk tol">
<style>
.t{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif}
.s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}
.bus{animation:melaju 7s linear infinite}
@keyframes melaju{0%{transform:translateX(0)}100%{transform:translateX(330px)}}
@media (prefers-reduced-motion: reduce){.bus{animation:none}}
</style>
<rect width="1600" height="900" fill="#EFE4C6"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#0B1450" stroke-opacity=".25" stroke-width="3"/>
<text x="100" y="120" class="s" font-size="64" fill="#0B1450">Kenapa listrik AC bisa dikirim jauh</text>
<text x="100" y="172" class="t" font-size="30" fill="#0B1450" fill-opacity=".75">Perumpamaannya: mengantar 1.000 orang lewat jalan tol</text>
<defs><g id="m"><rect width="34" height="16" rx="6"/><circle cx="6" cy="20" r="6"/><circle cx="28" cy="20" r="6"/></g><g id="b"><rect width="130" height="44" rx="10"/><rect x="12" y="8" width="24" height="16" fill="#EFE4C6"/><rect x="44" y="8" width="24" height="16" fill="#EFE4C6"/><rect x="76" y="8" width="24" height="16" fill="#EFE4C6"/><circle cx="26" cy="46" r="9"/><circle cx="104" cy="46" r="9"/></g></defs>
<!-- road -->
<rect x="90" y="380" width="1420" height="150" fill="#0B1450" fill-opacity=".12"/>
<line x1="90" x2="1510" y1="455" y2="455" stroke="#0B1450" stroke-opacity=".4" stroke-width="4" stroke-dasharray="30 22"/>
<!-- motors jam (left) -->
<g fill="#0B1450">
  
  <use href="#m" x="110" y="395"/><use href="#m" x="160" y="395"/><use href="#m" x="210" y="395"/><use href="#m" x="260" y="395"/><use href="#m" x="310" y="395"/><use href="#m" x="360" y="395"/>
  <use href="#m" x="130" y="440"/><use href="#m" x="180" y="440"/><use href="#m" x="230" y="440"/><use href="#m" x="280" y="440"/><use href="#m" x="330" y="440"/><use href="#m" x="380" y="440"/>
  <use href="#m" x="110" y="485"/><use href="#m" x="160" y="485"/><use href="#m" x="210" y="485"/><use href="#m" x="260" y="485"/><use href="#m" x="310" y="485"/><use href="#m" x="360" y="485"/>
</g>
<!-- terminal -->
<rect x="560" y="330" width="220" height="250" rx="16" fill="#B80B17"/>
<text x="670" y="430" class="t" font-size="40" font-weight="800" fill="#EFE4C6" text-anchor="middle">TRAFO</text>
<text x="670" y="475" class="t" font-size="26" fill="#EFE4C6" text-anchor="middle">= terminal</text>
<!-- buses -->
<clipPath id="tol"><rect x="800" y="380" width="710" height="150"/></clipPath>
<g clip-path="url(#tol)"><g class="bus" fill="#0B1450">
  
  <use href="#b" x="830" y="398"/><use href="#b" x="1100" y="460"/><use href="#b" x="560" y="460"/><use href="#b" x="1350" y="398"/>
</g></g>
<!-- labels -->
<g class="t" fill="#0B1450">
  <text x="100" y="640" font-size="34" font-weight="800">Banyak motor, tol macet</text>
  <text x="100" y="684" font-size="28">tegangan rendah, arus besar</text>
  <text x="100" y="724" font-size="28">banyak panas terbuang di kabel</text>
  <text x="1500" y="640" font-size="34" font-weight="800" text-anchor="end" fill="#B80B17">Sedikit bus, tol lancar</text>
  <text x="1500" y="684" font-size="28" text-anchor="end">tegangan tinggi, arus kecil</text>
  <text x="1500" y="724" font-size="28" text-anchor="end">sedikit panas terbuang</text>
  <text x="800" y="815" font-size="30" text-anchor="middle">Penumpang = daya · jumlah kendaraan = arus · macet = panas terbuang</text>
  <text x="800" y="262" font-size="30" text-anchor="middle" fill="#B80B17" font-weight="700">Arus dua kali lipat, panas terbuang empat kali lipat</text>
</g>
</svg>
