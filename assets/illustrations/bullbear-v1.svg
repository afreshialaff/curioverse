<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ilustrasi bull dan bear market: harga naik lalu turun lebih dari 20 persen dari puncak">
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>

<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700">Bull vs bear</text>
<line x1="150" y1="790" x2="1460" y2="790" stroke="#CDBFA6" stroke-width="3"/>
<path d="M150,730 L250,680 L330,700 L430,600 L520,630 L620,500 L700,520 L800,370 L870,340" fill="none" stroke="#3F6B3A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M870,340 L940,420 L1010,390 L1090,510 L1170,490 L1260,600 L1340,580 L1440,680" fill="none" stroke="#9A3F2B" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="870" cy="340" r="13" fill="#1B1A17"/><text x="870" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1B1A17" font-weight="700" text-anchor="middle">puncak</text>
<line x1="890" y1="340" x2="1500" y2="340" stroke="#1B1A17" stroke-width="2" stroke-dasharray="6 8"/>
<line x1="1500" y1="340" x2="1500" y2="680" stroke="#1B1A17" stroke-width="3"/>
<line x1="1485" y1="340" x2="1515" y2="340" stroke="#1B1A17" stroke-width="3"/><line x1="1485" y1="680" x2="1515" y2="680" stroke="#1B1A17" stroke-width="3"/>
<text x="1530" y="740" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#9A3F2B" font-weight="700" text-anchor="end">turun ≥ 20% dari puncak</text>
<g transform="translate(330 330)">
    <path d="M-80 -40 C -130 -80 -140 -150 -110 -190 C -105 -140 -80 -100 -40 -80 Z" fill="#1B1A17"/>
    <path d="M80 -40 C 130 -80 140 -150 110 -190 C 105 -140 80 -100 40 -80 Z" fill="#1B1A17"/>
    <path d="M-90 -60 Q 0 -100 90 -60 L 70 60 Q 0 110 -70 60 Z" fill="#3F6B3A"/>
    <ellipse cx="0" cy="62" rx="58" ry="36" fill="#E1D8C6"/>
    <circle cx="-22" cy="62" r="7" fill="#1B1A17"/><circle cx="22" cy="62" r="7" fill="#1B1A17"/>
    <circle cx="-40" cy="-10" r="10" fill="#EAE3D5"/><circle cx="40" cy="-10" r="10" fill="#EAE3D5"/>
    <text x="0" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" fill="#3F6B3A" font-weight="700" text-anchor="middle">BULL</text><text x="0" y="202" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4D483F" text-anchor="middle">tanduk menyerang ke atas</text>
  </g><g transform="translate(1290 240)">
    <circle cx="-70" cy="-80" r="34" fill="#9A3F2B"/><circle cx="70" cy="-80" r="34" fill="#9A3F2B"/>
    <circle cx="-70" cy="-80" r="15" fill="#E1D8C6"/><circle cx="70" cy="-80" r="15" fill="#E1D8C6"/>
    <ellipse cx="0" cy="0" rx="100" ry="92" fill="#9A3F2B"/>
    <ellipse cx="0" cy="38" rx="44" ry="32" fill="#E1D8C6"/><ellipse cx="0" cy="24" rx="15" ry="10" fill="#1B1A17"/>
    <circle cx="-38" cy="-18" r="10" fill="#1B1A17"/><circle cx="38" cy="-18" r="10" fill="#1B1A17"/>
    <g stroke="#9A3F2B" stroke-width="9" stroke-linecap="round"><line x1="140" y1="-40" x2="110" y2="70"/><line x1="170" y1="-40" x2="140" y2="70"/><line x1="200" y1="-40" x2="170" y2="70"/></g>
    <text x="0" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" fill="#9A3F2B" font-weight="700" text-anchor="middle">BEAR</text><text x="0" y="192" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4D483F" text-anchor="middle">cakar menyerang ke bawah</text>
