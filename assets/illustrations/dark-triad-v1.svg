<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagram tiga lingkaran narsisme, Machiavellianisme, dan psikopati yang tumpang tindih, dengan ringkasan hubungannya dengan karier">
<rect width="1600" height="900" fill="#EAE3D5"/>
<rect x="28" y="28" width="1544" height="844" rx="22" fill="none" stroke="#CDBFA6" stroke-width="3"/>

<text x="100" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#1B1A17" font-weight="700">Tiga sisi gelap, satu inti</text>
<text x="100" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#4D483F">Paulhus &amp; Williams (2002): tumpang tindih, tapi bukan hal yang sama</text>
<circle cx="420" cy="400" r="165" fill="#7A5532" fill-opacity=".16" stroke="#7A5532" stroke-width="5"/><circle cx="640" cy="400" r="165" fill="#9A3F2B" fill-opacity=".16" stroke="#9A3F2B" stroke-width="5"/><circle cx="530" cy="580" r="165" fill="#3F4A3B" fill-opacity=".16" stroke="#3F4A3B" stroke-width="5"/>
<rect x="65" y="212" width="330" height="86" rx="14" fill="#F1ECE1" stroke="#7A5532" stroke-width="2"/><text x="230" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#7A5532" font-weight="700" text-anchor="middle">Narsisme</text><text x="230" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#4D483F" text-anchor="middle">merasa istimewa</text>
<rect x="665" y="212" width="330" height="86" rx="14" fill="#F1ECE1" stroke="#9A3F2B" stroke-width="2"/><text x="830" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#9A3F2B" font-weight="700" text-anchor="middle">Machiavellianisme</text><text x="830" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#4D483F" text-anchor="middle">manipulatif</text>
<rect x="365" y="752" width="330" height="86" rx="14" fill="#F1ECE1" stroke="#3F4A3B" stroke-width="2"/><text x="530" y="790" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#3F4A3B" font-weight="700" text-anchor="middle">Psikopati</text><text x="530" y="824" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#4D483F" text-anchor="middle">impulsif, minim empati</text>
<circle cx="530" cy="460" r="58" fill="#F1ECE1" stroke="#1B1A17" stroke-width="3"/>
<text x="530" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#1B1A17" font-weight="700" text-anchor="middle">kurang</text><text x="530" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#1B1A17" font-weight="700" text-anchor="middle">ramah</text>
<g transform="translate(1020 250)"><rect width="500" height="500" rx="18" fill="#F1ECE1" stroke="#CDBFA6" stroke-width="3"/></g>
<text x="1062" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1B1A17" font-weight="700">Naik vs berprestasi</text>
<circle cx="1062" cy="371" r="9" fill="#7A5532"/><text x="1084" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#1B1A17" font-weight="700">Narsisme</text><text x="1084" y="414" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F">gaji lebih tinggi (Spurk dkk.)</text>
<circle cx="1062" cy="461" r="9" fill="#9A3F2B"/><text x="1084" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#1B1A17" font-weight="700">Machiavellianisme</text><text x="1084" y="504" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F">lebih sering jadi atasan</text>
<circle cx="1062" cy="551" r="9" fill="#3F4A3B"/><text x="1084" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#1B1A17" font-weight="700">Psikopati</text><text x="1084" y="594" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F">gaji &amp; posisi justru lebih rendah</text>
<line x1="1062" x2="1478" y1="625" y2="625" stroke="#CDBFA6" stroke-width="2"/>
<text x="1062" y="670" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#1B1A17" font-weight="700">Kinerja kerja: hampir nol</text>
<text x="1062" y="706" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4D483F">~1% variasi (O'Boyle dkk., 2012)</text>
<text x="1540" y="846" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4D483F" text-anchor="end">Ilustrasi: Curioverse · disederhanakan dari riset yang dikutip</text>
</svg>
