name: Posting Instagram
# Jalan tiap hari ~18.50 WIB dan cadangan 19.30 WIB (cron GitHub bisa telat beberapa menit); skrip menunggu sampai
# jam di pipeline/config.json -> social.post_time lalu memposting post.json yang lolos review Lup.
on:
  schedule:
    - cron: "50 11 * * *"
    - cron: "30 12 * * *"   # cadangan 19.30 WIB: kalau jadwal 18.50 telat/terlewat, skrip tetap mencoba. Post yang sudah posted dilewati.
  workflow_dispatch:
    inputs:
      date: { description: "Tanggal WIB (YYYY-MM-DD), kosongkan untuk hari ini", required: false }
      dry_run: { description: "1 = cuma simulasi", required: false, default: "0" }
      site_url: { description: "Opsional: basis URL media (mis. https://raw.githubusercontent.com/afreshialaff/curioverse/main) kalau deploy Vercel gagal", required: false }
permissions:
  contents: write
concurrency: { group: social-repo-write, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Posting
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SITE_URL: ${{ github.event.inputs.site_url || '' }}
        run: node scripts/instagram-post.mjs ${{ github.event.inputs.date }}
      - name: Catat hasil
        if: always()
        run: |
          git config user.name "curioverse-bot"
          git config user.email "curioverse-bot@users.noreply.github.com"
          git add social
          git diff --cached --quiet && exit 0
          git commit -m "social: catat hasil posting Instagram"
          git pull --rebase origin main && git push origin HEAD:main
