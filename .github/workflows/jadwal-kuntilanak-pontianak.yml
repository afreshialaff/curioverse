name: Jadwal sekali jalan - Kuntilanak Pontianak 22.00 WIB
# Satu kali, 2026-11-11: tunggu sampai 22.00 WIB, setujui review, lalu picu posting Instagram + Threads.
# Cron GitHub bisa telat, jadi ada dua pemicu (21.25 dan 21.45 WIB); yang kedua berhenti kalau sudah dijalankan.
on:
  schedule:
    - cron: "25 14 11 11 *"
    - cron: "45 14 11 11 *"
    - cron: "15 15 11 11 *"   # cadangan 22.15 WIB
    - cron: "0 16 11 11 *"    # cadangan 23.00 WIB
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: jadwal-kuntilanak-pontianak, cancel-in-progress: false }
jobs:
  jadwal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DIR: social/2026-11-11/1-vivid-kuntilanak-pontianak
    steps:
      - uses: actions/checkout@v4
      - name: Tunggu 22.00 WIB lalu picu posting
        run: |
          [ -f "$DIR/.dijadwalkan" ] && { echo "sudah dijalankan, berhenti"; exit 0; }
          target=$(date -d "2026-11-11 22:00:00 +0700" +%s)
          now=$(date +%s)
          # Cron GitHub sering telat: kalau menyala setelah 22.00 (hari itu atau sesudahnya), langsung posting.
          [ $((target-now)) -gt 3000 ] && { echo "terlalu awal (>50 menit sebelum 22.00 WIB 2026-11-11), berhenti"; exit 0; }
          [ "$now" -lt "$target" ] && { echo "tunggu $((target-now)) detik"; sleep $((target-now)); }
          git pull --rebase -q origin main
          python3 - <<'PY'
          import json,os
          f=os.environ["DIR"]+"/post.json"
          p=json.load(open(f)); p["review"]["status"]="lolos"
          if p.get("post",{}).get("status")=="skipped": p["post"]["status"]="queued"
          p["review"]["notes"]+=" | disetujui otomatis 22.00 WIB sesuai jadwal pemilik."
          json.dump(p,open(f,"w"),ensure_ascii=False,indent=2)
          PY
          date -u +%FT%TZ > "$DIR/.dijadwalkan"
          git config user.name "curioverse-bot"; git config user.email "curioverse-bot@users.noreply.github.com"
          git add "$DIR" && git commit -m "social: setujui Kuntilanak Pontianak untuk posting 22.00 WIB"
          git pull --rebase origin main && git push origin HEAD:main
          gh workflow run instagram-post.yml -f date=2026-11-11
          gh workflow run threads-post.yml -f file="$DIR/threads.json"
