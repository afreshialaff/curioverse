name: Cek tayang Vivid (IG + Threads)
# Pengecekan otomatis setelah jam tayang. Kalau jadwal belum jalan atau posting belum masuk,
# workflow ini memicunya lagi. Aman dijalankan berkali-kali: yang sudah tayang dilewati.
#   Kuntilanak Pontianak: tayang 22.00 WIB 2026-11-11 -> cek 22.15 dan 22.45 WIB
#   Parakang:             tayang 20.00 WIB 2026-11-12 -> cek 20.15 dan 20.45 WIB
#   Suanggi:              tayang 20.00 WIB 2026-11-13 -> cek 20.15 dan 20.45 WIB
#   Kuyang:               tayang 20.00 WIB 2026-11-14 -> cek 20.15 dan 20.45 WIB
#   Nyi Roro Kidul:       tayang 20.00 WIB 2026-11-15 -> cek 20.25 dan 20.50 WIB
#   Malin Kundang:        tayang 20.00 WIB 2026-11-16 -> cek 20.15 dan 20.45 WIB
#   Orang Bunian:         tayang 20.00 WIB 2026-11-17 -> cek 20.15 dan 20.45 WIB
#   Hantu Jeruk Purut:    tayang 20.00 WIB 2026-11-19 -> cek 20.25 dan 20.50 WIB
#   Palasik:              tayang 20.00 WIB 2026-11-21 -> cek 20.30 dan 21.00 WIB
#   Roro Jonggrang LONG:  tayang 20.00 WIB 2026-11-22 -> cek 20.25 dan 20.50 WIB
#   Suku Moro:            tayang 08.00 WIB 2026-11-18 -> cek 08.15 dan 08.45 WIB
#   Wewe Gombel:          tayang 20.00 WIB 2026-11-25 -> cek 20.30 dan 21.00 WIB
#   Tuyul:                tayang 20.00 WIB 2026-11-26 -> cek 20.30 dan 21.00 WIB
#   Pocong:               tayang 20.00 WIB 2026-11-27 -> cek 20.30 dan 21.00 WIB
#   Batu Menangis:        tayang 20.00 WIB 2026-11-28 -> cek 20.30 dan 21.00 WIB
on:
  schedule:
    - cron: "15 15 11 11 *"
    - cron: "45 15 11 11 *"
    - cron: "15 13 12 11 *"
    - cron: "45 13 12 11 *"
    - cron: "15 13 13 11 *"
    - cron: "45 13 13 11 *"
    - cron: "15 13 14 11 *"
    - cron: "45 13 14 11 *"
    - cron: "25 13 15 11 *"
    - cron: "50 13 15 11 *"
    - cron: "15 13 16 11 *"
    - cron: "45 13 16 11 *"
    - cron: "15 13 17 11 *"
    - cron: "45 13 17 11 *"
    - cron: "15 1 18 11 *"
    - cron: "45 1 18 11 *"
    - cron: "25 13 19 11 *"
    - cron: "50 13 19 11 *"
    - cron: "15 13 20 11 *"   # cek 20.15 WIB Genderuwo
    - cron: "45 13 20 11 *"   # cek ulang 20.45 WIB
    - cron: "30 13 21 11 *"   # cek 20.30 WIB Palasik
    - cron: "0 14 21 11 *"    # cek ulang 21.00 WIB
    - cron: "25 13 22 11 *"   # cek 20.25 WIB Roro Jonggrang
    - cron: "50 13 22 11 *"   # cek ulang 20.50 WIB
    - cron: "30 13 25 11 *"   # cek 20.30 WIB Wewe Gombel
    - cron: "0 14 25 11 *"    # cek ulang 21.00 WIB
    - cron: "30 13 26 11 *"   # cek 20.30 WIB Tuyul
    - cron: "0 14 26 11 *"    # cek ulang 21.00 WIB
    - cron: "30 13 27 11 *"   # cek 20.30 WIB Pocong
    - cron: "0 14 27 11 *"    # cek ulang 21.00 WIB
    - cron: "30 13 28 11 *"   # cek 20.30 WIB Batu Menangis
    - cron: "0 14 28 11 *"    # cek ulang 21.00 WIB
    - cron: "25 13 29 11 *"   # cek 20.25 WIB Rawa Pening LONG
    - cron: "55 13 29 11 *"   # cek ulang 20.55 WIB
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: { group: cek-tayang-vivid, cancel-in-progress: false }
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Cek dan picu ulang kalau perlu
        run: |
          set -u
          now=$(date +%s)
          cek() {  # $1 tanggal  $2 jam tayang  $3 folder  $4 workflow jadwal
            tgl=$1; target=$(date -d "$1 $2:00 +0700" +%s); DIR=$3; JW=$4
            # hanya dalam jendela 10 menit s.d. 6 jam setelah jam tayang
            if [ $((now-target)) -lt 600 ] || [ $((now-target)) -gt 21600 ]; then echo "[$tgl] di luar jendela cek, lewati"; return; fi
            echo "== [$tgl] $DIR"
            if [ ! -f "$DIR/.dijadwalkan" ]; then
              echo "jadwal belum jalan -> picu $JW"; gh workflow run "$JW"; return
            fi
            st=$(python3 -c "import json;print(json.load(open('$DIR/post.json')).get('post',{}).get('status'))")
            echo "status Instagram: $st"
            if [ "$st" != "posted" ]; then
              aktif=$(gh run list --workflow instagram-post.yml --json status --jq '[.[]|select(.status!="completed")]|length')
              [ "$aktif" = "0" ] && { echo "Instagram belum tayang -> picu ulang"; gh workflow run instagram-post.yml -f date="$tgl"; } || echo "Instagram masih berjalan"
            fi
            iso=$(date -u -d "@$((target-3600))" +%FT%TZ)
            if [[ "$DIR" != *roro-jonggrang* ]]; then   # Roro Jonggrang: tanpa Threads
              ok=$(gh run list --workflow threads-post.yml -L 30 --json createdAt,status,conclusion \
                   --jq "[.[]|select(.createdAt>=\"$iso\")|select(.conclusion==\"success\" or .status!=\"completed\")]|length")
              echo "run Threads sukses/berjalan sejak jadwal: $ok"
              [ "$ok" = "0" ] && { echo "Threads belum tayang -> picu ulang"; gh workflow run threads-post.yml -f file="$DIR/threads.json"; }
            fi
            fbst=$(gh run list --workflow facebook-post.yml -L 30 --json createdAt,status,conclusion \
                 --jq "[.[]|select(.createdAt>=\"$iso\")|select(.conclusion==\"success\" or .status!=\"completed\")]|length")
            echo "run Facebook sukses/berjalan sejak jadwal: $fbst"
            [ "$fbst" = "0" ] && { echo "Facebook belum tayang -> picu ulang"; gh workflow run facebook-post.yml -f file="$DIR/facebook.json"; }
            return 0
          }
          cek 2026-11-11 22:00 social/2026-11-11/1-vivid-kuntilanak-pontianak jadwal-kuntilanak-pontianak.yml
          cek 2026-11-12 20:00 social/2026-11-12/1-vivid-parakang jadwal-parakang.yml
          cek 2026-11-13 20:00 social/2026-11-13/1-vivid-suanggi jadwal-suanggi.yml
          cek 2026-11-14 20:00 social/2026-11-14/1-vivid-kuyang jadwal-kuyang.yml
          cek 2026-11-15 20:00 social/2026-11-15/1-vivid-nyi-roro-kidul jadwal-nyi-roro-kidul.yml
          cek 2026-11-16 20:00 social/2026-11-16/1-vivid-malin-kundang jadwal-malin-kundang.yml
          cek 2026-11-17 20:00 social/2026-11-17/1-vivid-orang-bunian jadwal-orang-bunian.yml
          cek 2026-11-18 08:00 social/2026-11-18/1-vivid-suku-moro jadwal-suku-moro.yml
          cek 2026-11-19 20:00 social/2026-11-19/1-vivid-hantu-jeruk-purut jadwal-hantu-jeruk-purut.yml
          cek 2026-11-20 20:00 social/2026-11-20/1-vivid-genderuwo jadwal-genderuwo.yml
          cek 2026-11-21 20:00 social/2026-11-21/1-vivid-palasik jadwal-palasik.yml
          cek 2026-11-22 20:00 social/2026-11-22/1-vivid-roro-jonggrang jadwal-roro-jonggrang.yml
          cek 2026-11-25 20:00 social/2026-11-25/1-vivid-wewe-gombel jadwal-wewe-gombel.yml
          cek 2026-11-26 20:00 social/2026-11-26/1-vivid-tuyul jadwal-tuyul.yml
          cek 2026-11-27 20:00 social/2026-11-27/1-vivid-pocong jadwal-pocong.yml
          cek 2026-11-28 20:00 social/2026-11-28/1-vivid-batu-menangis jadwal-batu-menangis.yml
          cek 2026-11-29 20:00 social/2026-11-29/1-vivid-rawa-pening jadwal-rawa-pening.yml
