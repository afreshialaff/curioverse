name: Jadwal sekali jalan - Sangkuriang 21.00 WIB
# Satu kali, 2026-11-27: tunggu sampai 21.00 WIB, setujui review, lalu picu posting Instagram + Threads + Facebook.
# Cron GitHub bisa telat, jadi ada dua pemicu (20.25 dan 20.45 WIB); yang kedua berhenti kalau sudah dijalankan.
on:
  schedule:
    - cron: "25 13 27 11 *"
    - cron: "45 13 27 11 *"
    - cron: "15 14 27 11 *"   # cadangan 21.15 WIB
    - cron: "0 15 27 11 *"    # cadangan 22.00 WIB
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: jadwal-sangkuriang, cancel-in-progress: false }
jobs:
  jadwal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DIR: social/2026-11-27/2-vivid-sangkuriang
    steps:
      - uses: actions/checkout@v4
      - name: Tunggu 21.00 WIB lalu picu posting
        run: |
          [ -f "$DIR/.dijadwalkan" ] && { echo "sudah dijalankan, berhenti"; exit 0; }
          target=$(date -d "2026-11-27 21:00:00 +0700" +%s)
          now=$(date +%s)
          # Cron GitHub sering telat: kalau menyala setelah 23.00 (hari itu atau sesudahnya), langsung posting.
          [ $((target-now)) -gt 3000 ] && { echo "terlalu awal (>50 menit sebelum 21.00 WIB 2026-11-27), berhenti"; exit 0; }
          [ "$now" -lt "$target" ] && { echo "tunggu $((target-now)) detik"; sleep $((target-now)); }
          git pull --rebase -q origin main
          test -f "$DIR/reel.mp4" || { echo "reel.mp4 belum ada di $DIR, batal"; exit 1; }
          python3 - <<'PY'
          import json,os
          f=os.environ["DIR"]+"/post.json"
          p=json.load(open(f)); p["review"]["status"]="lolos"
          if p.get("post",{}).get("status")=="skipped": p["post"]["status"]="queued"
          p["review"]["notes"]+=" | disetujui otomatis 21.00 WIB sesuai jadwal pemilik."
          json.dump(p,open(f,"w"),ensure_ascii=False,indent=2)
          PY
          date -u +%FT%TZ > "$DIR/.dijadwalkan"
          git config user.name "curioverse-bot"; git config user.email "curioverse-bot@users.noreply.github.com"
          git add "$DIR" && git commit -m "social: setujui Sangkuriang untuk posting 21.00 WIB"
          git pull --rebase origin main && git push origin HEAD:main
          gh workflow run instagram-post.yml -f date=2026-11-27
          gh workflow run threads-post.yml -f file="$DIR/threads.json"
          gh workflow run facebook-post.yml -f file="$DIR/facebook.json"
